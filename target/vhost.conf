<VirtualHost *:80>
    ServerName vulnerable.local

    # Reverse proxy — forward all requests to the attacker backend
    # 10.0.2.2 = VirtualBox NAT gateway (your host machine)
    ProxyPass        / http://10.0.2.2:9090/
    ProxyPassReverse / http://10.0.2.2:9090/

    # THIS IS THE VULNERABLE CONFIGURATION:
    # ProxyHTMLEnable inserts mod_proxy_html into the output filter chain,
    # which in turn invokes mod_xml2enc to transcode the backend's charset
    # into UTF-8. A malformed multi-byte response triggers the NULL
    # pointer dereference in mod_xml2enc.
    ProxyHTMLEnable  On
    xml2EncDefault   utf-8

    ErrorLog  /var/log/apache2/error.log
    CustomLog /var/log/apache2/access.log combined
    LogLevel  notice
</VirtualHost>
